<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Los leaderboards de los mapas de STONKS">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C0C0D">
<title>Leaderboards STONKS</title>
<!-- El paquete de diseño de STONKS (diseno/README.md en finanzas): los mismos
     tokens, fuente y chispa que KANBAN, ALMACÉN y FINANZAS. Sin data-app en
     <html> el acento es el naranja de STONKS. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="diseno/tokens.css">
<script src="diseno/chispa.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--frame); }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  img { display: block; }
  [hidden] { display: none !important; }

  .shell { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }

  /* ── Cabecera ── */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { width: 36px; height: 36px; flex: none; display: grid; place-items: center; }
  .top h1 { font-size: clamp(1.35rem, 3.2vw, 1.75rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .top .right { margin-left: auto; }
  .eyebrow { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); }
  .lede { color: var(--muted); font-size: 0.92rem; margin: 10px 0 24px; max-width: 62ch; }

  /* ── Componentes del paquete (como en FINANZAS, css/journey.css) ── */
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-l); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
  .card-head h3 { font-size: 0.96rem; font-weight: 600; letter-spacing: -0.01em; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; border: 1px solid transparent; line-height: 1; white-space: nowrap; text-decoration: none;
    transition: background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), filter .16s var(--ease), transform .3s var(--spring);
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn:active { transform: scale(.96); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--line); }
  .btn-sm { padding: 7px 12px; font-size: 0.8rem; }
  @media (hover: hover) {
    .btn-secondary:hover { background: var(--surface-3); }
  }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; line-height: 1.35; white-space: nowrap; border: 1px solid transparent; }
  .badge-muted { color: var(--muted); border-color: var(--line); }
  .badge-amber { background: var(--s-amber); color: var(--k-amber); }

  .seg { display: inline-flex; align-self: flex-start; max-width: 100%; overflow-x: auto; background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    display: inline-flex; align-items: center; gap: 7px;
    border: none; background: transparent; color: var(--muted);
    font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none;
    transition: background-color .16s var(--ease), color .16s var(--ease), transform .3s var(--spring);
  }
  @media (hover: hover) { .seg button:not([aria-selected="true"]):hover { color: var(--text); background: rgba(255,255,255,.04); } }
  .seg button:active { transform: scale(.96); }
  .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-t); font-weight: 700; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }

  /* ── Estructura: mapas a la izquierda, el mapa elegido a la derecha ── */
  .layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 20px; align-items: start; }
  .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* Lista de mapas */
  .maps { padding: 10px; position: sticky; top: 16px; }
  .maps > .eyebrow { padding: 6px 8px 8px; }
  .map-list { display: flex; flex-direction: column; gap: 2px; }
  .map-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px; border: 1px solid transparent; border-radius: 14px;
    background: transparent; text-align: left; cursor: pointer;
    transition: background-color .16s var(--ease), border-color .16s var(--ease);
  }
  @media (hover: hover) { .map-item:hover { background: rgba(255,255,255,.04); } }
  .map-item[aria-selected="true"] { background: var(--surface-2); border-color: var(--line); }
  .map-item .txt { display: flex; flex-direction: column; min-width: 0; }
  .map-item .name { font-size: 0.86rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-item .sub { font-size: 0.72rem; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .map-item[aria-selected="true"] .sub .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }

  /* La imagen del mapa: el icono de Epic si existe, si no la miniatura. */
  .thumb {
    position: relative; flex: none; overflow: hidden;
    width: 56px; aspect-ratio: 16 / 9; border-radius: 8px;
    background: var(--surface-3); border: 1px solid var(--line-soft);
    display: grid; place-items: center; font-size: 1rem;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb img.icon { object-fit: contain; padding: 6%; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .thumb.has-icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.45)); }
  .thumb.has-icon img.icon { z-index: 1; }

  /* Ficha del mapa */
  .hero { display: flex; gap: 18px; padding: 16px; align-items: center; }
  .hero .thumb { width: 200px; border-radius: var(--r-m); font-size: 2.2rem; }
  .hero .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .hero .eyebrow { display: flex; align-items: center; gap: 7px; }
  .hero h2 { font-size: clamp(1.1rem, 2.6vw, 1.4rem); font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; overflow-wrap: anywhere; }
  .hero .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
  .code-chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 3px 10px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line-soft);
    font-family: var(--mono); font-size: 0.76rem; color: var(--muted); letter-spacing: .02em;
    transition: color .16s var(--ease), border-color .16s var(--ease);
  }
  .code-chip svg { width: 12px; height: 12px; }
  @media (hover: hover) { .code-chip:hover { color: var(--text); border-color: var(--line); } }
  .code-chip.done { color: var(--k-green); border-color: var(--t-green); }
  .hero .actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

  /* Jugadores en el mapa: Epic (cada 10 min, nulo por debajo de 5) y, si
     Epic no lo tiene, fortnite.gg. */
  .live { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); min-height: 1.5em; }
  .live strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .live .faint { color: var(--faint); font-size: 0.76rem; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; position: relative; }
  .pulse.on { background: var(--t-green); }
  .pulse.on::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--t-green); opacity: 0; animation: pulso 2s var(--ease-out) infinite;
  }
  @keyframes pulso { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
  .map-item .sub .pulse { width: 6px; height: 6px; }

  /* Tabla del top */
  .head-sub { font-size: 0.76rem; color: var(--faint); }
  table { width: 100%; border-collapse: collapse; }
  thead th { color: var(--faint); font-size: 0.72rem; font-weight: 500; text-align: left; padding: 9px 18px; border-bottom: 1px solid var(--line-soft); }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 18px; border-bottom: 1px solid var(--line-soft); font-size: 0.88rem; color: var(--text); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  @media (hover: hover) { tbody tr:hover { background: rgba(255,255,255,.025); } }
  td.rank { width: 56px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--c, var(--text)); white-space: nowrap; }
  td.player { overflow-wrap: anywhere; }
  td.player .badge { margin-left: 6px; vertical-align: 1px; }
  .pos {
    display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
    font-size: 0.76rem; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums;
  }
  .pos.p1 { background: rgba(255,196,92,.16); color: #FFC45C; }
  .pos.p2 { background: rgba(200,205,215,.14); color: #D4D8E0; }
  .pos.p3 { background: rgba(214,140,90,.16); color: #E7A47A; }
  tr.vacia td { color: var(--faint); }
  .empty { padding: 36px 18px; text-align: center; color: var(--faint); font-size: 0.88rem; }

  .status { padding: 56px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); font-size: 0.9rem; text-align: center; }
  footer { margin-top: 28px; color: var(--faint); font-size: 0.78rem; }
  footer a { color: var(--muted); }

  /* Móvil: los mapas pasan a una tira que se desliza */
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .maps { position: static; padding: 8px; }
    .maps > .eyebrow { display: none; }
    .map-list { flex-direction: row; overflow-x: auto; }
    .map-item { width: auto; flex: none; padding: 6px 12px 6px 6px; }
    .map-item .thumb { width: 44px; }
    .map-item .sub { display: none; }
    .map-item .players-m { display: inline-flex; }
    .hero { flex-direction: column; align-items: stretch; }
    .hero .thumb { width: 100%; }
    .top .right { margin-left: 0; }
  }
  @media (max-width: 520px) {
    tbody td, thead th { padding-left: 12px; padding-right: 12px; }
    td.rank { width: 44px; }
  }
  .players-m { display: none; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--faint); font-weight: 500; margin-left: 2px; }
  .players-m .pulse { width: 6px; height: 6px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .pulse.on::after { animation: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="logo" id="logo"></span>
    <div>
      <div class="eyebrow">STONKS · Leaderboards</div>
      <h1>Leaderboards</h1>
    </div>
    <span class="right badge badge-muted" id="updated" hidden></span>
  </header>
  <p class="lede">El top de cada mapa y estadística, tal y como está ahora.</p>

  <div class="layout" id="layout" hidden>
    <nav class="card maps" aria-label="Mapas">
      <div class="eyebrow">Mapas</div>
      <div class="map-list sin-barra" id="mapList" role="tablist" aria-orientation="vertical"></div>
    </nav>
    <main class="main">
      <section class="card hero" id="hero" aria-live="polite"></section>
      <div class="seg sin-barra" id="stats" role="tablist" aria-label="Estadísticas"></div>
      <section class="card" id="board"></section>
    </main>
  </div>

  <div class="card status" id="status"><span id="statusChispa"></span><span id="statusText">Cargando leaderboards…</span></div>

  <footer>Nombres, imágenes y jugadores de los mapas: <a href="https://fortnite.gg/" target="_blank" rel="noopener">fortnite.gg</a> y la <a href="https://api.fortnite.com/ecosystem/v1/docs" target="_blank" rel="noopener">API pública de Epic</a>.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const state = { data: null, game: 0, stat: 0 };

const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
};

/* La chispa: logo quieto, icono de la pestaña y la de carga. */
if (typeof chispaSVG === 'function') {
  $('logo').innerHTML = chispaSVG({ color: 'var(--accent)', tam: 32, titulo: 'STONKS' });
  faviconChispa();
  state.carga = chispaCarga($('statusChispa'), { tam: 36 });
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Solo se pintan imágenes del CDN de Epic y colores #rrggbb: lo demás del
   JSON no llega a un atributo. */
const safeImg = u => /^https:\/\/cdn-\d+\.qstv\.on\.epicgames\.com\/[\w\/.-]+$/.test(String(u || '')) ? u : null;
const safeColor = c => /^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : null;
const islandCode = g => (g.island && /^\d{4}-\d{4}-\d{4}$/.test(g.island.code)) ? g.island.code : null;
const islandUrl = code => 'https://fortnite.gg/island?code=' + code;

/* «2026-10-14 22:08 UTC» → «hace 3 h» (con la fecha entera en el title). */
function parseUpdated(s) {
  const m = String(s || '').match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/);
  return m ? new Date(m[1] + 'T' + m[2] + ':00Z') : null;
}
function relTime(d) {
  if (!d || isNaN(d)) return '—';
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'ahora mismo';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const dias = Math.round(h / 24);
  return 'hace ' + dias + (dias === 1 ? ' día' : ' días');
}
function localDate(d) {
  return d && !isNaN(d) ? d.toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
}

/* La imagen del mapa: el icono (logo transparente) encima de la miniatura
   si Epic lo da; si no, solo la miniatura; si no hay nada, el emoji. */
function thumbHtml(g, cls = '') {
  const isl = g.island || {};
  const thumb = safeImg(isl.thumb), icon = safeImg(isl.icon);
  const alt = escapeHtml(isl.name || g.name);
  if (!thumb && !icon) return '<span class="thumb ' + cls + '" aria-hidden="true">' + escapeHtml(g.emoji || '🎮') + '</span>';
  return '<span class="thumb ' + cls + (icon ? ' has-icon' : '') + '">' +
    (thumb ? '<img src="' + thumb + '" alt="' + (icon ? '' : alt) + '" loading="lazy" decoding="async">' : '') +
    (icon ? '<img class="icon" src="' + icon + '" alt="' + alt + '" loading="lazy" decoding="async">' : '') +
    '</span>';
}

/* ── Selección en la URL (#juego/stat) para poder enlazar y recargar ── */
function readHash() {
  const [gk, sk] = decodeURIComponent(location.hash.slice(1)).split('/');
  const gi = state.data.games.findIndex(g => g.key === gk);
  if (gi < 0) return;
  state.game = gi;
  const si = state.data.games[gi].stats.findIndex(s => s.key === sk);
  state.stat = si < 0 ? 0 : si;
}
function writeHash() {
  const g = state.data.games[state.game], s = g.stats[state.stat];
  history.replaceState(null, '', '#' + g.key + (s ? '/' + s.key : ''));
}

async function load() {
  try {
    const res = await fetch('widgets.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
  } catch (e) {
    return showStatus('No pude cargar widgets.json (' + e.message + ').');
  }
  if (!state.data.games || !state.data.games.length) {
    return showStatus('Aún no hay leaderboards. Vuelve cuando el bot haya corrido.');
  }
  readHash();
  $('status').hidden = true;
  if (state.carga) state.carga.parar();
  $('layout').hidden = false;

  const d = parseUpdated(state.data.updated);
  if (d) {
    const u = $('updated');
    u.hidden = false;
    u.textContent = 'Actualizado ' + relTime(d);
    u.title = localDate(d);
  }
  render();
  refreshPlayers();
  setInterval(() => { if (!document.hidden) refreshPlayers(); }, PLAYERS_EVERY_MS);
}

function showStatus(msg) {
  if (state.carga) state.carga.parar();
  $('statusChispa').hidden = true;
  $('statusText').textContent = msg;
}

function select(game, stat) {
  state.game = game;
  state.stat = stat;
  writeHash();
  render();
}

function render() {
  renderMaps();
  renderHero();
  renderStats();
  renderBoard();
}

function renderMaps() {
  const cont = $('mapList');
  cont.innerHTML = state.data.games.map((g, i) => {
    const n = (g.stats || []).length;
    const color = safeColor(g.color);
    return '<button class="map-item" role="tab" data-i="' + i + '" aria-selected="' + (i === state.game) + '"' +
      (color ? ' style="--c:' + color + '"' : '') + '>' +
      thumbHtml(g) +
      '<span class="txt"><span class="name">' + escapeHtml(g.name) + '</span>' +
      '<span class="sub" data-live="' + escapeHtml(g.key) + '"><span class="dot"></span>' +
        n + (n === 1 ? ' estadística' : ' estadísticas') + '</span></span>' +
      '<span class="players-m" data-live-m="' + escapeHtml(g.key) + '"></span>' +
    '</button>';
  }).join('');
  cont.querySelectorAll('.map-item').forEach(b => b.onclick = () => select(+b.dataset.i, 0));
  const sel = cont.querySelector('[aria-selected="true"]');
  if (sel && cont.scrollWidth > cont.clientWidth) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  renderLive();
}

function renderHero() {
  const g = state.data.games[state.game];
  const isl = g.island || {};
  const code = islandCode(g);
  const color = safeColor(g.color);
  const official = isl.name && isl.name.toLowerCase() !== String(g.name).toLowerCase();
  $('hero').innerHTML =
    (code ? '<a href="' + islandUrl(code) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' + thumbHtml(g) + '</a>' : thumbHtml(g)) +
    '<div class="info">' +
      '<div class="eyebrow"' + (color ? ' style="--c:' + color + '"' : '') + '><span class="dot"></span>' +
        escapeHtml(official ? g.name : 'Mapa') + '</div>' +
      '<h2>' + escapeHtml(isl.name || g.name) + '</h2>' +
      '<div class="meta">' +
        (code ? '<button type="button" class="code-chip" id="codeChip" title="Copiar el código de isla">' + ICON.copy + escapeHtml(code) + '</button>' : '') +
        (isl.creator ? '<span>de <strong>' + escapeHtml(isl.creator) + '</strong></span>' : '') +
      '</div>' +
      '<div class="live" id="heroLive"></div>' +
      (code ? '<div class="actions"><a class="btn btn-secondary btn-sm" href="' + islandUrl(code) + '" target="_blank" rel="noopener">' +
        ICON.ext + 'Ver en fortnite.gg</a></div>' : '') +
    '</div>';
  const chip = $('codeChip');
  if (chip) chip.onclick = () => copyText(code, () => flash(chip, ICON.check + 'Copiado', ICON.copy + escapeHtml(code)));
  renderLive();
}

function renderStats() {
  const g = state.data.games[state.game];
  const cont = $('stats');
  cont.hidden = (g.stats || []).length < 2;
  cont.innerHTML = (g.stats || []).map((s, i) => {
    const c = safeColor(s.color);
    return '<button type="button" role="tab" data-i="' + i + '" aria-selected="' + (i === state.stat) + '">' +
      '<span class="dot"' + (c ? ' style="--c:' + c + '"' : '') + '></span>' + escapeHtml(s.title) + '</button>';
  }).join('');
  cont.querySelectorAll('button').forEach(b => b.onclick = () => select(state.game, +b.dataset.i));
}

function renderBoard() {
  const g = state.data.games[state.game];
  const s = (g.stats || [])[state.stat];
  const board = $('board');
  if (!s) {
    board.innerHTML = '<div class="empty">Este mapa no tiene estadísticas.</div>';
    return;
  }
  const c = safeColor(s.color);
  if (c) board.style.setProperty('--c', c); else board.style.removeProperty('--c');
  const rows = s.rows || [];
  const filled = rows.filter(r => r && r.name).length;
  const d = parseUpdated(s.updated);

  let body;
  if (!filled) {
    body = '<div class="empty">Aún no hay récords en esta estadística.</div>';
  } else {
    body = '<table><thead><tr><th>#</th><th>Jugador</th><th class="num">' + escapeHtml(s.title) + '</th></tr></thead><tbody>' +
      rows.map((r, i) => {
        const pos = '<span class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</span>';
        if (!r || !r.name) return '<tr class="vacia"><td class="rank">' + pos + '</td><td>—</td><td class="num"></td></tr>';
        return '<tr><td class="rank">' + pos + '</td>' +
          '<td class="player">' + escapeHtml(r.name) + (r.isVip ? '<span class="badge badge-amber">VIP</span>' : '') + '</td>' +
          '<td class="num">' + escapeHtml(r.value || '') + '</td></tr>';
      }).join('') +
      '</tbody></table>';
  }

  board.innerHTML =
    '<div class="card-head">' +
      '<span class="dot"></span>' +
      '<div><h3>' + escapeHtml(s.title) + '</h3>' +
      '<div class="head-sub"' + (d ? ' title="' + escapeHtml(localDate(d)) + '"' : '') + '>' +
        (filled ? 'Top ' + filled : 'Sin récords') + ' · actualizado ' + escapeHtml(relTime(d)) + '</div></div>' +
    '</div>' + body;
}

function flash(el, html, back) {
  el.innerHTML = html;
  el.classList.add('done');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.innerHTML = back; el.classList.remove('done'); }, 1600);
}

async function copyText(text, ok) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // Navegadores sin Clipboard API (o sin https)
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
  ok();
}

/* ── Jugadores en cada mapa, en directo desde el navegador ──
   Epic (api.fortnite.com) tiene CORS abierto y da el pico de jugadores cada
   10 minutos, con 10-20 min de retraso. Devuelve null si en ese tramo hubo
   menos de 5 jugadores y 404 si la isla no es pública y descubrible. Solo en
   esos dos casos se pregunta a fortnite.gg (por r.jina.ai, como FINANZAS:
   fortnite.gg no da CORS), que es más lento pero tiene la cifra exacta. */
const EPIC = 'https://api.fortnite.com/ecosystem/v1/islands/';
const LECTOR = 'https://r.jina.ai/';
const PLAYERS_EVERY_MS = 3 * 60 * 1000;
state.live = {};

async function getJson(url, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), opts.timeout || 12000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, headers: opts.headers });
    if (r.status === 404) return { missing: true };
    if (!r.ok) return null;
    return await r.json();
  } catch (_) {
    return null;
  } finally {
    clearTimeout(t);
  }
}

const values = j => ((j && j.intervals) || []).filter(i => typeof i.value === 'number');

async function epicPlayers(code) {
  const [now, day] = await Promise.all([
    getJson(EPIC + code + '/metrics/minute/peak-ccu'),
    getJson(EPIC + code + '/metrics/hour/peak-ccu'),
  ]);
  if (!now) return null;
  if (now.missing || !(now.intervals || []).length) return { missing: true };
  const vals = values(now), last = vals[vals.length - 1];
  const peaks = values(day).map(i => i.value);
  return {
    now: last ? last.value : null,
    under5: !last,
    at: last ? new Date(last.timestamp) : null,
    peak24: peaks.length ? Math.max(...peaks) : null,
    src: 'Epic',
  };
}

async function ggPlayers(code) {
  const j = await getJson(LECTOR + 'https://fortnite.gg/island?code=' + code,
    { headers: { Accept: 'application/json' }, timeout: 25000 });
  const text = j && j.data && !j.data.warning ? String(j.data.content || '') : '';
  const m = text.match(/Players right now\s+([\d.,]+)\s*(K?)/i);
  if (!m) return null;
  const n = Math.round(parseFloat(m[1].replace(/,/g, '')) * (m[2] ? 1000 : 1));
  return Number.isFinite(n) ? { now: n, under5: false, at: new Date(), src: 'fortnite.gg' } : null;
}

async function playersOf(g) {
  const code = islandCode(g);
  if (!code) return null;
  const epic = await epicPlayers(code);
  if (epic && !epic.missing && !epic.under5) return epic;
  const gg = await ggPlayers(code);
  if (gg) return { ...gg, peak24: epic && epic.peak24 };
  return epic && epic.under5 ? epic : null;
}

async function refreshPlayers() {
  await Promise.all(state.data.games.map(async g => {
    const p = await playersOf(g);
    if (p || !state.live[g.key]) state.live[g.key] = p || { none: true };
    renderLive();
  }));
}

const fmtN = n => Number(n).toLocaleString('es-ES');

function playersText(p) {
  if (p.under5) return 'Menos de 5 jugando';
  return fmtN(p.now) + ' jugando';
}

function renderLive() {
  if (!state.data) return;
  state.data.games.forEach(g => {
    const p = state.live[g.key];
    if (!p || p.none) return;
    const on = !p.under5 && p.now > 0;
    const sub = document.querySelector('[data-live="' + CSS.escape(g.key) + '"]');
    if (sub) sub.innerHTML = '<span class="pulse' + (on ? ' on' : '') + '"></span>' + escapeHtml(playersText(p));
    const mob = document.querySelector('[data-live-m="' + CSS.escape(g.key) + '"]');
    if (mob) mob.innerHTML = '<span class="pulse' + (on ? ' on' : '') + '"></span>' + escapeHtml(p.under5 ? '<5' : fmtN(p.now));
  });

  const hero = $('heroLive');
  if (!hero) return;
  const g = state.data.games[state.game];
  const p = state.live[g.key];
  if (!islandCode(g) || (p && p.none)) { hero.hidden = true; return; }
  hero.hidden = false;
  if (!p) { hero.innerHTML = '<span class="pulse"></span><span class="faint">Mirando cuántos juegan…</span>'; return; }
  const on = !p.under5 && p.now > 0;
  hero.innerHTML =
    '<span class="pulse' + (on ? ' on' : '') + '"></span>' +
    (p.under5 ? '<span>Menos de <strong>5</strong> jugando</span>' : '<span><strong>' + fmtN(p.now) + '</strong> jugando ahora</span>') +
    (p.peak24 != null ? '<span>· pico 24 h <strong>' + fmtN(p.peak24) + '</strong></span>' : '') +
    '<span class="faint" title="' + escapeHtml(p.at ? localDate(p.at) : '') + '">· ' + escapeHtml(p.src) +
      (p.at && p.src === 'Epic' ? ', ' + escapeHtml(relTime(p.at)) : '') + '</span>';
}

window.addEventListener('hashchange', () => { if (state.data) { readHash(); render(); } });
load();
</script>
