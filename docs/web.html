<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Los leaderboards de los mapas de STONKS">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#161618">
<title>LEADERBOARDS STONKS</title>
<!-- El paquete de diseño de STONKS (el mismo que KANBAN, ALMACÉN y FINANZAS)
     y el armazón del kanban: barra lateral con carpetas y panel redondeado. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="diseno/tokens.css">
<script src="diseno/chispa.js"></script>
<style>
:root{
  --fr:14px; --side-w:264px; --maxw:1120px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}
img{display:block}

/* ── Cabecera ── */
.app{min-height:100dvh; display:flex; flex-direction:column}
.hdr{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(14px); backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.hdr-in{max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gl) var(--gr)}
.hdr-row{display:flex; align-items:center; gap:12px; min-height:60px; padding-block:8px}
.hdr-t{flex:1; min-width:0}
.hdr-row h1{
  margin:0; font-family:var(--display); font-weight:700; letter-spacing:-.025em;
  font-size:24px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.icon-btn{
  position:relative; width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center;
  color:var(--muted); text-decoration:none;
  transition:background .16s var(--ease), color .16s var(--ease), transform .2s var(--spring);
}
@media (hover:hover){.icon-btn:hover{background:var(--surface-2); color:var(--text)}}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.hdr-menu{display:none; margin-left:-10px}
.logo{width:28px; height:28px; flex:none; display:block}

.page{width:100%; max-width:var(--maxw); margin-inline:auto; padding:18px var(--gr) calc(32px + env(safe-area-inset-bottom,0px)) var(--gl)}

/* ── Barra lateral con carpetas (una por creador) ── */
.side{position:fixed; z-index:60; left:0; top:0; bottom:0; width:var(--side-w); display:flex; flex-direction:column;
  padding:16px 12px calc(12px + env(safe-area-inset-bottom,0px)) 14px; background:var(--frame); overflow:hidden}
.side-mid{flex:1; min-height:0; display:flex; flex-direction:column; gap:2px; margin-inline:-6px; padding:10px 6px;
  overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none}
.side-mid::-webkit-scrollbar{display:none}
body.shell .app{margin-left:var(--side-w)}
.side-brand{flex:none; display:flex; align-items:center; gap:12px; padding:4px 6px 14px; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.02em;
  border-bottom:1px solid transparent; transition:border-color .2s var(--ease)}
.side-brand.lift{border-bottom-color:var(--line-soft)}
.side-brand .logo{width:38px; height:38px}
.side-brand > span{white-space:nowrap; font-size:14px; letter-spacing:.01em}
.side-logo{display:block; flex:none; border-radius:10px; transition:transform .3s var(--spring)}
.side-logo:active{transform:scale(.9)}
.side-it{position:relative; display:flex; align-items:center; gap:10px; min-height:42px; padding:6px 10px; border-radius:12px; color:var(--muted); text-decoration:none;
  transition:background .14s var(--ease), color .14s var(--ease)}
@media (hover:hover){.side-it:hover{background:rgba(255,255,255,.04); color:var(--text)}}
.side-it.on{background:var(--surface); color:var(--text)}
.side-l{flex:1; min-width:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-sec{margin:6px 10px 4px; font-size:11px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.side-fold{display:flex; align-items:center; gap:6px; width:100%; min-height:34px; padding:4px 10px 4px 6px; border-radius:9px; color:var(--faint); text-align:left;
  transition:color .14s var(--ease), background .14s var(--ease)}
@media (hover:hover){.side-fold:hover{color:var(--text); background:var(--surface)}}
.side-chev{width:18px; height:18px; display:grid; place-items:center}
.side-chev svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s var(--spring)}
.side-fold[aria-expanded="true"] .side-chev svg{transform:rotate(90deg)}
.side-fl{flex:1; font-size:11.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase}
.side-n{font-size:11.5px; font-variant-numeric:tabular-nums}
.side-grp{display:flex; flex-direction:column; gap:1px; margin:0 0 6px 12px; padding-left:8px; border-left:1px solid var(--line-soft)}
.side-grp .side-it{min-height:40px}
.side-pn{font-size:14.5px}
.side-cnt{flex:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.side-it.on .side-cnt{color:var(--muted)}
.side-foot{flex:none; padding:12px 8px 0; display:flex; align-items:center; gap:8px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--faint)}
.side-scrim{display:none}

/* La miniatura del mapa hace de icono del tablero; si Epic da el icono, va encima. */
.thumb{position:relative; flex:none; overflow:hidden; display:grid; place-items:center; background:var(--surface-2); border-radius:8px}
.thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.thumb img.icon{object-fit:contain; padding:6%; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); z-index:1}
.thumb.has-icon::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
.side-it .thumb{width:28px; height:28px; font-size:14px}
.hdr .thumb{width:64px; aspect-ratio:16/9; border-radius:10px; font-size:18px}

/* ── Página del mapa ── */
.gen-date{margin:2px 2px 14px; color:var(--faint); font-size:13.5px; display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px}
.gen-date strong{color:var(--muted); font-weight:600}
.sep{color:var(--line)}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px;
  background:var(--surface); border:1px solid var(--line-soft); color:var(--muted);
  font-size:12.5px; font-variant-numeric:tabular-nums; transition:color .16s var(--ease), border-color .16s var(--ease);
}
.chip svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.chip strong{color:var(--text)}
button.chip{font-family:var(--mono); font-size:12px; letter-spacing:.02em}
@media (hover:hover){button.chip:hover{color:var(--text); border-color:var(--line)}}
button.chip.done{color:var(--k-green); border-color:var(--t-green)}

/* Jugadores: Epic cada 10 min (nulo por debajo de 5) y, si no lo tiene, fortnite.gg. */
.pulse{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; position:relative}
.pulse.on{background:var(--t-green)}
.pulse.on::after{content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--t-green); opacity:0; animation:pulso 2s var(--ease-out) infinite}
@keyframes pulso{0%{transform:scale(.6); opacity:.7} 100%{transform:scale(1.6); opacity:0}}

/* Una ficha por estadística, como las cifras de General: el color en el punto
   y no en la ficha. Pulsarla enseña su top. */
.gen-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px}
.gen-stat{--gt:var(--t-slate); position:relative; display:flex; flex-direction:column; gap:4px; padding:42px 20px 16px; border-radius:var(--r-l); color:var(--muted); text-align:left;
  background:var(--surface); border:1px solid transparent; min-width:0; transition:border-color .16s var(--ease), transform .3s var(--spring)}
.gen-stat::before{content:''; position:absolute; top:18px; left:20px; width:10px; height:10px; border-radius:99px; background:var(--gt); box-shadow:0 0 0 4px color-mix(in srgb,var(--gt) 22%,transparent)}
@media (hover:hover){.gen-stat:hover{border-color:color-mix(in srgb,var(--gt) 60%,transparent)}}
.gen-stat:active{transform:scale(.985)}
.gen-stat[aria-selected="true"]{border-color:var(--gt); background:color-mix(in srgb,var(--gt) 7%,var(--surface))}
.gen-n{font-family:var(--display); font-weight:700; font-size:34px; line-height:1.05; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:-.03em; overflow-wrap:anywhere}
.gen-l{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gen-l strong{color:var(--text); font-weight:600}
.gen-h{margin:32px 2px 12px; font-family:var(--display); font-size:21px; font-weight:700; letter-spacing:-.015em; color:var(--text); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.gen-h small{font-family:var(--sans); font-size:12.5px; font-weight:400; color:var(--faint); letter-spacing:0}

/* El top */
.board{background:var(--surface); border-radius:var(--r-l); overflow:hidden}
table{width:100%; border-collapse:collapse}
thead th{color:var(--faint); font-size:12px; font-weight:500; text-align:left; padding:12px 20px 10px; border-bottom:1px solid var(--line-soft)}
thead th.num{text-align:right}
tbody td{padding:11px 20px; border-bottom:1px solid var(--line-soft); font-size:14px; color:var(--text); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
@media (hover:hover){tbody tr:hover{background:rgba(255,255,255,.025)}}
td.rank{width:60px}
td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--c,var(--text)); white-space:nowrap}
td.player{overflow-wrap:anywhere}
.vip{display:inline-flex; margin-left:7px; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:650; letter-spacing:.04em; background:var(--s-amber); color:var(--k-amber); vertical-align:1px}
.pos{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-size:12px; font-weight:700; color:var(--faint); font-variant-numeric:tabular-nums}
.pos.p1{background:rgba(255,196,92,.16); color:#FFC45C}
.pos.p2{background:rgba(200,205,215,.14); color:#D4D8E0}
.pos.p3{background:rgba(214,140,90,.16); color:#E7A47A}
tr.vacia td{color:var(--faint)}
.empty{padding:40px 20px; text-align:center; color:var(--faint); font-size:14px}

.boot{position:fixed; inset:0; z-index:400; display:grid; place-items:center; background:var(--bg); color:var(--muted); font-size:14px}
.boot-in{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:0 24px}

/* Estrecho: la barra es un cajón que abre el menú de la cabecera. */
@media (max-width:899.98px){
  body.shell .app{margin-left:0}
  .side{transform:translateX(-102%); transition:transform .4s var(--spring-soft); z-index:120; box-shadow:var(--shadow); width:min(300px,86vw);
    padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-left:max(10px,env(safe-area-inset-left,0px))}
  body.side-open .side{transform:none}
  .side-scrim{display:block; position:fixed; inset:0; z-index:119; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s var(--ease)}
  body.side-open .side-scrim{opacity:1; pointer-events:auto}
  .side-it{min-height:44px}
  .hdr-menu{display:grid}
  .hdr .thumb{width:48px}
}
/* Ancho: la barra va sobre el negro de fuera y la página dentro de un panel
   redondeado, que es su propia caja de scroll (igual que el kanban). */
@media (min-width:900px){
  body.shell::after{content:''; position:fixed; z-index:55; inset:var(--fr) var(--fr) var(--fr) var(--side-w); pointer-events:none;
    border-radius:var(--r-frame); box-shadow:0 0 0 100vmax var(--frame)}
  body.shell{overflow:hidden; height:100dvh; min-height:0; padding-top:var(--fr)}
  body.shell .app{margin:0 var(--fr) 0 var(--side-w); height:calc(100dvh - 2 * var(--fr)); min-height:0;
    overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; border-radius:var(--r-frame)}
  body.shell .hdr{top:0; border-radius:var(--r-frame) var(--r-frame) 0 0; border-bottom:0; background:color-mix(in srgb,var(--bg) 94%,transparent)}
  body.shell .hdr-row{min-height:86px; padding-top:20px}
  body.shell .hdr-row h1{font-size:31px; letter-spacing:-.03em}
  body.shell .hdr-in,body.shell .page{padding-inline:40px; max-width:none}
  body.shell .gen-date{margin-top:-6px}
  body.shell .hdr .icon-btn{width:40px; height:40px; border-radius:99px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-soft)}
  body.shell .hdr .icon-btn svg{width:19px; height:19px}
  @media (hover:hover){body.shell .hdr .icon-btn:hover{background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}}
}
@media (max-width:520px){
  .gen-stats{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .gen-stat{padding:34px 12px 12px} .gen-stat::before{top:14px; left:12px}
  .gen-n{font-size:22px} .gen-l{font-size:12px} .gen-h{font-size:17px; margin-top:26px}
  tbody td,thead th{padding-left:12px; padding-right:12px} td.rank{width:46px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .pulse.on::after{animation:none}
}
</style>
</head>
<body class="shell">
<nav class="side" id="side" aria-label="Mapas">
  <div class="side-brand" id="brand">
    <a class="side-logo" href="https://stonksstudio.com" aria-label="Ir a la web de STONKS (stonksstudio.com)"><span class="logo" id="logo"></span></a>
    <span>STONKS LEADERBOARDS</span>
  </div>
  <div class="side-mid" id="sideMid"></div>
  <div class="side-foot" id="sideFoot" hidden></div>
</nav>
<div class="side-scrim" id="scrim"></div>

<div class="app" id="app" hidden>
  <header class="hdr">
    <div class="hdr-in"><div class="hdr-row">
      <button class="icon-btn hdr-menu" id="menuBtn" type="button" aria-label="Mapas" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <span id="hdrThumb"></span>
      <div class="hdr-t"><h1 id="title"></h1></div>
      <a class="icon-btn" id="ggLink" target="_blank" rel="noopener" aria-label="Ver en fortnite.gg" title="Ver en fortnite.gg" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </a>
    </div></div>
  </header>
  <main class="page">
    <p class="gen-date" id="meta"></p>
    <div class="gen-stats" id="stats" role="tablist" aria-label="Estadísticas"></div>
    <h2 class="gen-h" id="boardTitle"></h2>
    <section class="board" id="board"></section>
  </main>
</div>

<div class="boot" id="boot"><div class="boot-in"><span id="bootChispa"></span><span id="bootText" hidden></span></div></div>

<script>
const $ = id => document.getElementById(id);
const state = { data: null, game: 0, stat: 0, live: {} };
const SVG = {
  chev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
};

if (typeof chispaCarga === 'function') {
  faviconChispa();
  state.carga = chispaCarga($('bootChispa'), { tam: 32, etiqueta: 'Cargando' });
  chispaCarga($('logo'), { clase: 'logo', tam: 0, etiqueta: null, reducido: 'quieta' });
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Del JSON solo llegan a un atributo imágenes del CDN de Epic y colores #rrggbb. */
const safeImg = u => /^https:\/\/cdn-\d+\.qstv\.on\.epicgames\.com\/[\w\/.-]+$/.test(String(u || '')) ? u : null;
const safeColor = c => /^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : null;
const islandCode = g => (g.island && /^\d{4}-\d{4}-\d{4}$/.test(g.island.code)) ? g.island.code : null;
const islandUrl = code => 'https://fortnite.gg/island?code=' + code;
const fmtN = n => Number(n).toLocaleString('es-ES');

function parseUpdated(s) {
  const m = String(s || '').match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/);
  return m ? new Date(m[1] + 'T' + m[2] + ':00Z') : null;
}
function relTime(d) {
  if (!d || isNaN(d)) return '—';
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'ahora mismo';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const dias = Math.round(h / 24);
  return 'hace ' + dias + (dias === 1 ? ' día' : ' días');
}
const localDate = d => d && !isNaN(d) ? d.toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
const releasedText = iso => {
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? new Date(iso + 'T12:00:00Z') : null;
  return d ? d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
};

function thumbHtml(g) {
  const isl = g.island || {};
  const thumb = safeImg(isl.thumb), icon = safeImg(isl.icon);
  if (!thumb && !icon) return '<span class="thumb" aria-hidden="true">' + escapeHtml(g.emoji || '🎮') + '</span>';
  return '<span class="thumb' + (icon ? ' has-icon' : '') + '" aria-hidden="true">' +
    (thumb ? '<img src="' + thumb + '" alt="" loading="lazy" decoding="async">' : '') +
    (icon ? '<img class="icon" src="' + icon + '" alt="" loading="lazy" decoding="async">' : '') +
    '</span>';
}

/* ── Carpetas por creador; dentro, del mapa más nuevo al más viejo ── */
const CREATOR_ORDER = ['dani280n2', 'sonoq', 'aidenomalley'];
const creatorOf = g => (g.island && g.island.creator) || '';
function creatorGroups() {
  const by = new Map();
  state.data.games.forEach((g, i) => {
    const c = creatorOf(g);
    if (!by.has(c)) by.set(c, []);
    by.get(c).push(i);
  });
  const rank = c => {
    if (!c) return Infinity;
    const i = CREATOR_ORDER.indexOf(c.toLowerCase());
    return i < 0 ? CREATOR_ORDER.length : i;
  };
  const released = i => (state.data.games[i].island || {}).released || '';
  return [...by.entries()]
    .sort(([a], [b]) => rank(a) - rank(b) || a.localeCompare(b))
    .map(([creator, games]) => ({
      creator,
      games: games.sort((a, b) => released(b).localeCompare(released(a)) || a - b),
    }));
}

/* Plegar una carpeta es de cada uno: se recuerda en el navegador. */
const FOLD_KEY = 'stonks-leaderboards-folds';
const FOLDS = new Set((() => { try { return JSON.parse(localStorage.getItem(FOLD_KEY) || '[]'); } catch (_) { return []; } })());
const saveFolds = () => { try { localStorage.setItem(FOLD_KEY, JSON.stringify([...FOLDS])); } catch (_) {} };

function renderSide() {
  const mid = $('sideMid'), y = mid.scrollTop;
  let html = '<div class="side-sec">Mapas</div>';
  creatorGroups().forEach((gr, gi) => {
    const id = gr.creator || '_sin';
    const open = !FOLDS.has(id);
    html += '<button class="side-fold" type="button" data-fold="' + escapeHtml(id) + '" aria-expanded="' + open + '" aria-controls="sg-' + gi + '">' +
      '<span class="side-chev">' + SVG.chev + '</span><span class="side-fl">' + escapeHtml(gr.creator || 'Sin creador') + '</span>' +
      (open ? '' : '<span class="side-n">' + gr.games.length + '</span>') + '</button>' +
      '<div class="side-grp" id="sg-' + gi + '"' + (open ? '' : ' hidden') + '>' +
      gr.games.map(i => {
        const g = state.data.games[i];
        return '<a class="side-it' + (i === state.game ? ' on' : '') + '" href="#' + encodeURIComponent(g.key) + '"' +
          (i === state.game ? ' aria-current="page"' : '') + ' data-i="' + i + '">' +
          thumbHtml(g) + '<span class="side-l side-pn">' + escapeHtml(g.name) + '</span>' +
          '<span class="side-cnt" data-live="' + escapeHtml(g.key) + '"></span></a>';
      }).join('') + '</div>';
  });
  mid.innerHTML = html;
  mid.scrollTop = y;
  mid.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => {
    const f = b.dataset.fold;
    FOLDS.has(f) ? FOLDS.delete(f) : FOLDS.add(f);
    saveFolds();
    renderSide();
  });
  mid.querySelectorAll('.side-it').forEach(a => a.onclick = e => {
    e.preventDefault();
    sideOpen(false);
    select(+a.dataset.i, 0);
  });
  renderLive();
}

function sideOpen(open) {
  document.body.classList.toggle('side-open', open);
  $('menuBtn').setAttribute('aria-expanded', String(open));
}

/* ── Selección en la URL (#juego/stat) para poder enlazar y recargar ── */
function readHash() {
  const [gk, sk] = decodeURIComponent(location.hash.slice(1)).split('/');
  const gi = state.data.games.findIndex(g => g.key === gk);
  if (gi < 0) {
    state.game = creatorGroups()[0].games[0];
    state.stat = 0;
    return;
  }
  state.game = gi;
  const si = state.data.games[gi].stats.findIndex(s => s.key === sk);
  state.stat = si < 0 ? 0 : si;
}
function writeHash() {
  const g = state.data.games[state.game], s = g.stats[state.stat];
  history.replaceState(null, '', '#' + g.key + (s ? '/' + s.key : ''));
}
function select(game, stat) {
  state.game = game;
  state.stat = stat;
  writeHash();
  render();
  $('app').scrollTo({ top: 0 });
}

function render() {
  renderSide();
  renderHeader();
  renderStats();
  renderBoard();
}

function renderHeader() {
  const g = state.data.games[state.game];
  const isl = g.island || {};
  const code = islandCode(g);
  $('hdrThumb').innerHTML = thumbHtml(g);
  $('title').textContent = isl.name || g.name;
  document.title = (isl.name || g.name) + ' · LEADERBOARDS STONKS';
  const link = $('ggLink');
  link.hidden = !code;
  if (code) link.href = islandUrl(code);

  const text = [];
  if (isl.creator) text.push('<span>de <strong>' + escapeHtml(isl.creator) + '</strong></span>');
  const rel = releasedText(isl.released);
  if (rel) text.push('<span>lanzado el ' + escapeHtml(rel) + '</span>');
  $('meta').innerHTML = text.join('<span class="sep" aria-hidden="true">·</span>') +
    (code ? '<button type="button" class="chip" id="codeChip" title="Copiar el código de isla">' + SVG.copy + escapeHtml(code) + '</button>' +
      '<span class="chip" id="heroLive" hidden></span>' : '');
  const chip = $('codeChip');
  if (chip) chip.onclick = () => copyText(code, () => flash(chip, SVG.check + 'Copiado', SVG.copy + escapeHtml(code)));
  renderLive();
}

function renderStats() {
  const g = state.data.games[state.game];
  const cont = $('stats');
  cont.innerHTML = (g.stats || []).map((s, i) => {
    const c = safeColor(s.color);
    const top = (s.rows || []).find(r => r && r.name);
    return '<button type="button" class="gen-stat" role="tab" data-i="' + i + '" aria-selected="' + (i === state.stat) + '"' +
      (c ? ' style="--gt:' + c + '"' : '') + '>' +
      '<span class="gen-n">' + escapeHtml(top ? top.value : '—') + '</span>' +
      '<span class="gen-l">' + escapeHtml(s.title) + (top ? ' · <strong>' + escapeHtml(top.name) + '</strong>' : ' · sin récords') + '</span>' +
    '</button>';
  }).join('');
  cont.querySelectorAll('.gen-stat').forEach(b => b.onclick = () => select(state.game, +b.dataset.i));
}

function renderBoard() {
  const g = state.data.games[state.game];
  const s = (g.stats || [])[state.stat];
  const board = $('board');
  if (!s) {
    $('boardTitle').textContent = '';
    board.innerHTML = '<div class="empty">Este mapa no tiene estadísticas.</div>';
    return;
  }
  const c = safeColor(s.color);
  if (c) board.style.setProperty('--c', c); else board.style.removeProperty('--c');
  const rows = s.rows || [];
  const filled = rows.filter(r => r && r.name).length;
  const d = parseUpdated(s.updated);
  $('boardTitle').innerHTML = escapeHtml(filled ? 'Top ' + filled : 'Top') +
    '<small' + (d ? ' title="' + escapeHtml(localDate(d)) + '"' : '') + '>' + escapeHtml(s.title) + ' · actualizado ' + escapeHtml(relTime(d)) + '</small>';

  if (!filled) {
    board.innerHTML = '<div class="empty">Aún no hay récords en esta estadística.</div>';
    return;
  }
  board.innerHTML = '<table><thead><tr><th>#</th><th>Jugador</th><th class="num">' + escapeHtml(s.title) + '</th></tr></thead><tbody>' +
    rows.map((r, i) => {
      const pos = '<span class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</span>';
      if (!r || !r.name) return '<tr class="vacia"><td class="rank">' + pos + '</td><td>—</td><td class="num"></td></tr>';
      return '<tr><td class="rank">' + pos + '</td>' +
        '<td class="player">' + escapeHtml(r.name) + (r.isVip ? '<span class="vip">VIP</span>' : '') + '</td>' +
        '<td class="num">' + escapeHtml(r.value || '') + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function flash(el, html, back) {
  el.innerHTML = html;
  el.classList.add('done');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.innerHTML = back; el.classList.remove('done'); }, 1600);
}
async function copyText(text, ok) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
  ok();
}

/* ── Jugadores en cada mapa, en directo desde el navegador ──
   Epic (api.fortnite.com) tiene CORS abierto y da el pico de jugadores cada
   10 minutos, con 10-20 min de retraso. Devuelve null si en ese tramo hubo
   menos de 5 jugadores y 404 si la isla no es pública y descubrible. Solo en
   esos dos casos se pregunta a fortnite.gg (por r.jina.ai, como FINANZAS:
   fortnite.gg no da CORS), que es más lento pero tiene la cifra exacta. */
const EPIC = 'https://api.fortnite.com/ecosystem/v1/islands/';
const LECTOR = 'https://r.jina.ai/';
const PLAYERS_EVERY_MS = 3 * 60 * 1000;

async function getJson(url, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), opts.timeout || 12000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, headers: opts.headers });
    if (r.status === 404) return { missing: true };
    if (!r.ok) return null;
    return await r.json();
  } catch (_) {
    return null;
  } finally {
    clearTimeout(t);
  }
}
const values = j => ((j && j.intervals) || []).filter(i => typeof i.value === 'number');

async function epicPlayers(code) {
  const [now, day] = await Promise.all([
    getJson(EPIC + code + '/metrics/minute/peak-ccu'),
    getJson(EPIC + code + '/metrics/hour/peak-ccu'),
  ]);
  if (!now) return null;
  if (now.missing || !(now.intervals || []).length) return { missing: true };
  const vals = values(now), last = vals[vals.length - 1];
  const peaks = values(day).map(i => i.value);
  return {
    now: last ? last.value : null,
    under5: !last,
    at: last ? new Date(last.timestamp) : null,
    peak24: peaks.length ? Math.max(...peaks) : null,
    src: 'Epic',
  };
}

async function ggPlayers(code) {
  const j = await getJson(LECTOR + 'https://fortnite.gg/island?code=' + code,
    { headers: { Accept: 'application/json' }, timeout: 25000 });
  const text = j && j.data && !j.data.warning ? String(j.data.content || '') : '';
  const m = text.match(/Players right now\s+([\d.,]+)\s*(K?)/i);
  if (!m) return null;
  const n = Math.round(parseFloat(m[1].replace(/,/g, '')) * (m[2] ? 1000 : 1));
  return Number.isFinite(n) ? { now: n, under5: false, at: new Date(), src: 'fortnite.gg' } : null;
}

async function playersOf(g) {
  const code = islandCode(g);
  if (!code) return null;
  const epic = await epicPlayers(code);
  if (epic && !epic.missing && !epic.under5) return epic;
  const gg = await ggPlayers(code);
  if (gg) return { ...gg, peak24: epic && epic.peak24 };
  return epic && epic.under5 ? epic : null;
}

async function refreshPlayers() {
  await Promise.all(state.data.games.map(async g => {
    const p = await playersOf(g);
    if (p || !state.live[g.key]) state.live[g.key] = p || { none: true };
    renderLive();
  }));
}

function renderLive() {
  if (!state.data) return;
  state.data.games.forEach(g => {
    const p = state.live[g.key];
    const cnt = document.querySelector('[data-live="' + CSS.escape(g.key) + '"]');
    if (!cnt || !p || p.none) return;
    const on = !p.under5 && p.now > 0;
    cnt.innerHTML = '<span class="pulse' + (on ? ' on' : '') + '"></span>' + escapeHtml(p.under5 ? '<5' : fmtN(p.now));
    cnt.setAttribute('aria-label', (p.under5 ? 'menos de 5' : fmtN(p.now)) + ' jugando');
  });

  const live = $('heroLive');
  if (!live) return;
  const p = state.live[state.data.games[state.game].key];
  live.hidden = !p || !!p.none;
  if (live.hidden) return;
  const on = !p.under5 && p.now > 0;
  live.innerHTML = '<span class="pulse' + (on ? ' on' : '') + '"></span>' +
    (p.under5 ? '<span>&lt; <strong>5</strong> jugando</span>' : '<span><strong>' + fmtN(p.now) + '</strong> jugando</span>');
  live.title = [
    p.src + (p.at && p.src === 'Epic' ? ', ' + relTime(p.at) : ''),
    p.peak24 != null ? 'pico 24 h: ' + fmtN(p.peak24) : '',
  ].filter(Boolean).join(' · ');
}

async function load() {
  try {
    const res = await fetch('widgets.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
  } catch (e) {
    return bootMsg('No pude cargar los leaderboards (' + e.message + ').');
  }
  if (!state.data.games || !state.data.games.length) {
    return bootMsg('Aún no hay leaderboards. Vuelve cuando el bot haya corrido.');
  }
  readHash();
  const d = parseUpdated(state.data.updated);
  if (d) {
    const foot = $('sideFoot');
    foot.hidden = false;
    foot.textContent = 'Actualizado ' + relTime(d);
    foot.title = localDate(d);
  }
  $('app').hidden = false;
  $('boot').hidden = true;
  if (state.carga) state.carga.parar();
  render();
  refreshPlayers();
  setInterval(() => { if (!document.hidden) refreshPlayers(); }, PLAYERS_EVERY_MS);
}

function bootMsg(msg) {
  if (state.carga) state.carga.parar();
  $('bootChispa').hidden = true;
  $('bootText').hidden = false;
  $('bootText').textContent = msg;
}

$('menuBtn').onclick = () => sideOpen(!document.body.classList.contains('side-open'));
$('scrim').onclick = () => sideOpen(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') sideOpen(false); });
$('sideMid').addEventListener('scroll', () => $('brand').classList.toggle('lift', $('sideMid').scrollTop > 2));
window.addEventListener('hashchange', () => { if (state.data) { readHash(); render(); } });
load();
</script>
