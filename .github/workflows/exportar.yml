name: Exportar

# Saca de Supabase lo que necesita la app nueva de leaderboards
# (stonks-ecosistema/leaderboards) y lo deja como artefacto «export».
# Se importa en el panel: Estado → Importar del bot de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Exportar
        env:
          PYTHONPATH: .
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python exportar.py
      - uses: actions/upload-artifact@v4
        with:
          name: export
          path: export.json
          retention-days: 7
