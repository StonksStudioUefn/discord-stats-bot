name: Actualizar leaderboard

on:
  # Botón "Run workflow" en la pestaña Actions del repo.
  workflow_dispatch:
    inputs:
      reprocesar:
        description: "IDs o enlaces de mensajes de Discord a reprocesar (separados por comas o espacios). Opcional."
        required: false
        default: ""
      silencioso:
        description: "No publicar en Discord ningún mensaje de error/rechazo (solo en el log)."
        type: boolean
        required: false
        default: false

  # Programado: cada hora en punto (UTC).
  # Cambia el patrón si quieres otra frecuencia:
  #   "*/30 * * * *"  -> cada 30 minutos
  #   "0 */6 * * *"   -> cada 6 horas
  schedule:
    - cron: "0 * * * *"

# Evita ejecuciones solapadas (manual + programada).
concurrency:
  group: actualizar-leaderboard
  cancel-in-progress: false

# Permiso para que el bot haga commit de docs/widgets.json al repo.
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        # Versión v5 (Node 24) -> elimina el warning de Node 20.
        uses: actions/checkout@v5

      - name: Configurar Python
        # Versión v6 (Node 24).
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la actualización por lotes
        env:
          # PYTHONPATH=. permite imports planos (config, database, etc.)
          PYTHONPATH: .
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          # Indica si la ejecución fue manual ('workflow_dispatch') o
          # por cron ('schedule'). El bot usa esto para decidir si
          # refresca TODOS los embeds (manual) o solo los que cambiaron.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Mensajes a reprocesar a mano (solo en ejecución manual).
          REPROCESAR: ${{ inputs.reprocesar }}
          # true = no publicar mensajes de error/rechazo en Discord.
          SILENCIOSO: ${{ inputs.silencioso }}
        run: python batch_update.py

      - name: Publicar widgets en la web (commit de docs/widgets.json)
        # Solo hace commit si el archivo cambió. Usa el GITHUB_TOKEN
        # automático (no necesitas crear tokens personales).
        run: |
          if [ -n "$(git status --porcelain docs/widgets.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/widgets.json
            git commit -m "Actualizar widgets [skip ci]"
            git push
          else
            echo "Sin cambios en docs/widgets.json; nada que publicar."
          fi
